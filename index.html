<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Cali Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap');

:root{
  --void:#0A0818; --night:#14102B; --night-deep:#1E1640;
  --ink:#F0EAFF; --ink-soft:#B8A8E0; --ink-dim:#7868A8;
  --gold:#E8C766; --gold-bright:#FFE9A8; --gold-dim:#9C8348;
  --line:#3D3168;
  --rad:#8441C7; --ant:#F09030; --dot:#6FA84A;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{min-height:100%; overflow-x:hidden;}
body{
  font-family:'Noto Serif KR',serif; background:var(--void); color:var(--ink);
  user-select:none; min-height:100vh; display:flex; flex-direction:column; align-items:center;
  position:relative;
}

#starfield{position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(132,65,199,0.30) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 75%, rgba(65,132,199,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(45,35,88,0.6) 0%, transparent 70%),
    linear-gradient(180deg, var(--void) 0%, var(--night) 45%, var(--night-deep) 100%);}
#starfield .star{position:absolute; background:var(--gold-bright); border-radius:50%; opacity:0.7; animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.2; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.3);}}

.page{position:relative; z-index:1; width:100%; max-width:920px; padding:36px 20px 64px;
  display:flex; flex-direction:column; align-items:center;}

.brand{text-align:center; margin-bottom:26px;}
.brand-mark{font-size:32px; margin-bottom:8px; filter:drop-shadow(0 0 16px rgba(232,199,102,0.5));}
.brand-title{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:36px; letter-spacing:3px;
  color:var(--gold); text-shadow:0 0 26px rgba(232,199,102,0.4); margin-bottom:4px;}
.brand-sub{font-size:13px; color:var(--ink-soft); letter-spacing:0.5px;}

/* hero carousel */
.hero{position:relative; width:100%; border-radius:26px; overflow:hidden;
  aspect-ratio:16/9; max-height:440px; border:1.5px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);}
@media(max-width:640px){ .hero{aspect-ratio:4/5; max-height:none;} }

.slides{position:absolute; inset:0;}
.slide{position:absolute; inset:0; opacity:0; transition:opacity .8s ease; display:flex; align-items:flex-end;}
.slide.active{opacity:1;}

.slide-art{position:absolute; inset:0; z-index:0;}
.slide-content{position:relative; z-index:2; padding:34px; max-width:60%;}
@media(max-width:640px){ .slide-content{max-width:92%; padding:24px;} }
.slide-tag{display:inline-block; font-size:11px; letter-spacing:2px; text-transform:uppercase;
  padding:4px 12px; border-radius:20px; margin-bottom:12px; font-weight:700; color:#fff;}
.slide-title{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:34px; line-height:1.15;
  margin-bottom:10px; text-shadow:0 3px 20px rgba(0,0,0,0.6);}
@media(max-width:640px){ .slide-title{font-size:26px;} }
.slide-desc{font-size:13.5px; color:rgba(255,255,255,0.88); line-height:1.5; margin-bottom:18px;
  text-shadow:0 2px 8px rgba(0,0,0,0.6);}
.slide-btn{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:#12101a;
  background:#fff; padding:11px 22px; border-radius:30px; font-weight:800; font-size:13px;
  letter-spacing:0.5px; transition:transform .12s;}
.slide-btn:active{transform:scale(0.95);}
.slide-btn .arr{transition:transform .2s;}
.slide-btn:hover .arr{transform:translateX(4px);}

.slide::before{content:""; position:absolute; inset:0; z-index:1;
  background:linear-gradient(90deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 45%, transparent 75%);}
@media(max-width:640px){ .slide::before{background:linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);} }

.hero-btn{position:absolute; top:50%; transform:translateY(-50%); z-index:5;
  width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(255,255,255,0.85); color:#222; font-size:18px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.3);}
.hero-btn.prev{left:14px;} .hero-btn.next{right:14px;}
.hero-btn:active{transform:translateY(-50%) scale(0.9);}
.dots{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:5; display:flex; gap:8px;}
@media(max-width:640px){ .dots{bottom:auto; top:14px;} }
.dot{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.4); cursor:pointer; transition:all .2s;}
.dot.active{background:#fff; width:24px; border-radius:5px;}

/* game art (CSS-drawn) */
.art-radoku{background:linear-gradient(135deg,#2a1650 0%,#4C2276 55%,#1a0e33 100%);}
.art-radoku .glow{position:absolute; inset:0; background:radial-gradient(circle at 72% 40%, rgba(183,144,222,0.5) 0%, transparent 55%);}
.art-radoku .grid{position:absolute; right:8%; top:50%; transform:translateY(-50%) rotate(-8deg);
  display:grid; grid-template-columns:repeat(4,44px); grid-template-rows:repeat(4,44px); gap:5px;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,0.5));}
@media(max-width:640px){ .art-radoku .grid{grid-template-columns:repeat(4,38px); grid-template-rows:repeat(4,38px); right:6%; top:26%;} }
.art-radoku .cell{border-radius:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(183,144,222,0.4);
  display:flex; align-items:center; justify-content:center; font-size:20px;}
.art-radoku .cell.lit{background:radial-gradient(circle at 35% 30%,#E8C766,#9C6B1E); box-shadow:0 0 14px rgba(232,199,102,0.7);}

.art-antopia{background:linear-gradient(135deg,#B05E10 0%,#F09030 50%,#FFC978 100%);}
.art-antopia .sky{position:absolute; inset:0; background:radial-gradient(ellipse at 30% 20%, rgba(255,240,200,0.6) 0%, transparent 60%);}
.art-antopia .sun{position:absolute; right:14%; top:16%; width:80px; height:80px; border-radius:50%;
  background:radial-gradient(circle,#FFF3C0,#FFD070); box-shadow:0 0 50px rgba(255,220,120,0.9);}
.art-antopia .parrot{position:absolute; right:16%; top:42%; font-size:96px; filter:drop-shadow(0 10px 20px rgba(0,0,0,0.35)); animation:bob 3s ease-in-out infinite;}
@media(max-width:640px){ .art-antopia .parrot{font-size:76px; top:22%; right:12%;} .art-antopia .sun{top:8%;} }
.art-antopia .leaf{position:absolute; font-size:40px; opacity:0.85;}
.art-antopia .leaf.l1{left:8%; bottom:8%; transform:rotate(-20deg);}
.art-antopia .leaf.l2{right:6%; bottom:4%; transform:rotate(15deg) scaleX(-1);}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-12px) rotate(3deg);}}

.art-dotoring{background:linear-gradient(180deg,#3f97dd 0%,#6fb8e8 26%,#a9ddf2 40%,#5a9c4a 42%,#3E6E28 100%);}
.art-dotoring .fog{position:absolute; inset:0; background:radial-gradient(ellipse at 60% 70%, rgba(255,255,255,0.25) 0%, transparent 55%);}
.art-dotoring .sun{position:absolute; right:12%; top:8%; width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle,#FFF7D0,#FFE08A); box-shadow:0 0 44px rgba(255,225,140,0.85);}
.art-dotoring .cloud{position:absolute; border-radius:40px; background:rgba(255,255,255,0.85);
  animation:drift 22s ease-in-out infinite alternate;}
.art-dotoring .cloud.c1{width:74px; height:22px; left:12%; top:12%;}
.art-dotoring .cloud.c2{width:56px; height:18px; left:44%; top:7%; animation-delay:-8s;}
@keyframes drift{from{transform:translateX(-12px);} to{transform:translateX(14px);}}
.art-dotoring .tree{position:absolute; bottom:14%; font-size:56px; filter:drop-shadow(0 8px 14px rgba(0,0,0,0.3));}
.art-dotoring .tree.t1{right:34%; font-size:70px;}
.art-dotoring .tree.t2{right:12%; bottom:10%;}
.art-dotoring .tree.t3{right:52%; bottom:18%; font-size:44px; opacity:0.85;}
.art-dotoring .cake{position:absolute; right:44%; bottom:44%; font-size:30px; animation:cakeFall 2.6s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.3));}
@keyframes cakeFall{0%,100%{transform:translateY(-10px);} 50%{transform:translateY(6px);}}
.art-dotoring .acorn{position:absolute; right:22%; bottom:20%; font-size:64px; filter:drop-shadow(0 8px 16px rgba(0,0,0,0.35)); animation:hop 1.6s ease-in-out infinite;}
@media(max-width:640px){ .art-dotoring .acorn{right:18%; bottom:30%; font-size:54px;} .art-dotoring .tree.t1{font-size:56px;} .art-dotoring .cake{bottom:52%;} }
@keyframes hop{0%,100%{transform:translateY(0);} 40%{transform:translateY(-18px);}}

/* 블루핑크 타워 아트 */
.art-bluepink{background:linear-gradient(180deg,#87CEEB 0%,#B8E0F5 40%,#FFB6D9 70%,#FF8AC2 100%);}
.art-bluepink .towerA{position:absolute; left:24%; bottom:0; width:56px; height:72%;
  background:linear-gradient(180deg,#5AA9E6,#3D7FC1); border-radius:10px 10px 0 0; box-shadow:0 0 24px rgba(90,169,230,0.6);}
.art-bluepink .towerB{position:absolute; right:24%; bottom:0; width:56px; height:58%;
  background:linear-gradient(180deg,#FF8AC2,#E85D9E); border-radius:10px 10px 0 0; box-shadow:0 0 24px rgba(255,138,194,0.6);}
.art-bluepink .plat{position:absolute; width:44px; height:10px; border-radius:6px; background:#fff; box-shadow:0 4px 10px rgba(0,0,0,0.2); animation:bob 3s ease-in-out infinite;}
.art-bluepink .plat.p1{left:38%; bottom:38%;}
.art-bluepink .plat.p2{left:48%; bottom:56%; animation-delay:-1s;}
.art-bluepink .plat.p3{left:40%; bottom:74%; animation-delay:-2s;}
.art-bluepink .climber{position:absolute; left:46%; bottom:60%; font-size:40px; animation:hop 1.8s ease-in-out infinite; filter:drop-shadow(0 8px 14px rgba(0,0,0,0.3));}
@media(max-width:640px){ .art-bluepink .climber{font-size:34px;} }

/* 겟 더 스타 아트 */
.art-star{background:linear-gradient(180deg,#7EC8E3 0%,#A8E6CF 55%,#56A845 100%);}
.art-star .bigstar{position:absolute; left:50%; top:34%; transform:translateX(-50%); font-size:80px;
  animation:starPulse 2.2s ease-in-out infinite; filter:drop-shadow(0 0 26px rgba(255,220,80,0.9));}
@keyframes starPulse{0%,100%{transform:translateX(-50%) scale(1) rotate(-6deg);} 50%{transform:translateX(-50%) scale(1.15) rotate(6deg);}}
.art-star .runnerB{position:absolute; left:22%; bottom:16%; font-size:44px; animation:hop 1.4s ease-in-out infinite; filter:drop-shadow(0 6px 12px rgba(0,0,0,0.3));}
.art-star .runnerP{position:absolute; right:22%; bottom:16%; font-size:44px; animation:hop 1.4s ease-in-out infinite; animation-delay:-0.7s; transform:scaleX(-1); filter:drop-shadow(0 6px 12px rgba(0,0,0,0.3));}
.art-star .banana{position:absolute; left:44%; bottom:12%; font-size:26px; transform:rotate(-18deg);}
@media(max-width:640px){ .art-star .bigstar{font-size:64px;} .art-star .runnerB,.art-star .runnerP{font-size:36px;} }

/* 가챠가쟈 일본가자 아트 */
.art-gacha{background:linear-gradient(180deg,#1a0d38 0%,#3d1f6e 55%,#ff2d95 140%);}
.art-gacha .neon{position:absolute; inset:0;
  background:radial-gradient(ellipse at 30% 25%, rgba(255,45,149,0.35) 0%, transparent 55%),
             radial-gradient(ellipse at 72% 60%, rgba(0,229,255,0.3) 0%, transparent 55%);}
.art-gacha .machine{position:absolute; bottom:8%; width:52px; height:88px; border-radius:9px;
  background:linear-gradient(180deg,#f4f4f4 0%,#f4f4f4 46%,#e8e8e8 46%,#dcdcdc 100%);
  box-shadow:0 8px 20px rgba(0,0,0,0.4);}
.art-gacha .machine::before{content:''; position:absolute; top:7px; left:7px; right:7px; height:32px; border-radius:5px;
  background:linear-gradient(135deg,#ffd166,#ff2d95);}
.art-gacha .machine::after{content:''; position:absolute; bottom:20px; left:50%; margin-left:-9px; width:18px; height:18px;
  border-radius:50%; background:#f0f0f0; border:3px solid #999;}
.art-gacha .machine.m1{left:16%;} .art-gacha .machine.m2{left:16%; bottom:calc(8% + 92px); height:80px;}
.art-gacha .machine.m3{right:16%;} .art-gacha .machine.m4{right:16%; bottom:calc(8% + 92px); height:80px;}
.art-gacha .capsule{position:absolute; left:50%; top:30%; font-size:64px; transform:translateX(-50%);
  animation:capsuleBob 2.4s ease-in-out infinite; filter:drop-shadow(0 0 22px rgba(255,45,149,0.8));}
@keyframes capsuleBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-8deg);} 50%{transform:translateX(-50%) translateY(-14px) rotate(8deg);}}
.art-gacha .torii{position:absolute; left:50%; bottom:8%; transform:translateX(-50%); font-size:40px; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}
@media(max-width:640px){ .art-gacha .capsule{font-size:52px;} .art-gacha .machine{width:42px; height:72px;} .art-gacha .machine.m2,.art-gacha .machine.m4{bottom:calc(8% + 76px); height:64px;} }

.feature-pills{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
.pill{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px;
  background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); color:#fff;
  backdrop-filter:blur(4px); white-space:nowrap;}
@media(max-width:640px){ .feature-pills{gap:5px; margin-bottom:12px;} .pill{font-size:9.5px; padding:3px 8px;} }

/* game cards */
.section-label{align-self:flex-start; margin:44px 4px 16px; font-family:'Nanum Myeongjo',serif;
  font-weight:800; font-size:18px; color:var(--gold-bright); letter-spacing:1px;}
.cards{width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:640px){ .cards{grid-template-columns:1fr;} }

.card{position:relative; text-decoration:none; color:var(--ink); border-radius:20px; overflow:hidden;
  border:1.5px solid var(--line); background:rgba(20,16,43,0.55); transition:transform .15s, box-shadow .15s;
  animation:none; opacity:1; transform:none;}
.card:active{transform:scale(0.97);}
.card-thumb{position:relative; width:100%; aspect-ratio:16/10; overflow:hidden;}
.card-thumb .badge{position:absolute; top:10px; left:10px; z-index:3; font-size:10px; font-weight:800;
  letter-spacing:1px; padding:3px 10px; border-radius:14px; color:#fff;}
.card-body{padding:14px 16px 18px; position:relative; z-index:2;}
.card-name{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:18px; margin-bottom:4px;}
.card-desc{font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
.card-play{display:inline-flex; align-items:center; gap:5px; margin-top:10px; font-size:12px; font-weight:700;}

.card.radoku{border-color:rgba(132,65,199,0.45);} .card.radoku:active{box-shadow:0 0 26px rgba(132,65,199,0.4);}
.card.radoku .badge{background:var(--rad);} .card.radoku .card-name{color:#D9B8FF;} .card.radoku .card-play{color:#D9B8FF;}
.card.antopia{border-color:rgba(240,144,48,0.45);} .card.antopia:active{box-shadow:0 0 26px rgba(240,144,48,0.4);}
.card.antopia .badge{background:var(--ant);} .card.antopia .card-name{color:#FFD9A0;} .card.antopia .card-play{color:#FFD9A0;}
.card.dotoring{border-color:rgba(120,180,90,0.5);} .card.dotoring:active{box-shadow:0 0 26px rgba(120,180,90,0.4);}
.card.dotoring .badge{background:var(--dot);} .card.dotoring .card-name{color:#D4EBB0;} .card.dotoring .card-play{color:#D4EBB0;}
.card.bluepink{border-color:rgba(90,169,230,0.5);} .card.bluepink:active{box-shadow:0 0 26px rgba(255,138,194,0.45);}
.card.bluepink .badge{background:linear-gradient(90deg,#5AA9E6,#FF8AC2);} .card.bluepink .card-name{color:#BFE0FF;} .card.bluepink .card-play{color:#FFB6D9;}
.card.star{border-color:rgba(255,215,80,0.5);} .card.star:active{box-shadow:0 0 26px rgba(255,215,80,0.4);}
.card.star .badge{background:#E8A020;} .card.star .card-name{color:#FFE9A8;} .card.star .card-play{color:#FFE9A8;}
.card.gacha{border-color:rgba(255,45,149,0.5);} .card.gacha:active{box-shadow:0 0 26px rgba(255,45,149,0.45);}
.card.gacha .badge{background:#ff2d95;} .card.gacha .card-name{color:#FF9ECF;} .card.gacha .card-play{color:#FF9ECF;}

.card .card-thumb .thumb-emoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:52px; z-index:2;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,0.4));}
/* shrink hero-sized art bits when reused inside the small card thumbnails */
.card .card-thumb .sun{width:30px; height:30px; right:10%; top:10%; box-shadow:0 0 20px rgba(255,225,140,0.8);}
.card .card-thumb .cloud, .card .card-thumb .cake, .card .card-thumb .tree, .card .card-thumb .grid, .card .card-thumb .parrot, .card .card-thumb .leaf,
.card .card-thumb .towerA, .card .card-thumb .towerB, .card .card-thumb .plat, .card .card-thumb .climber,
.card .card-thumb .bigstar, .card .card-thumb .runnerB, .card .card-thumb .runnerP, .card .card-thumb .banana,
.card .card-thumb .machine, .card .card-thumb .capsule, .card .card-thumb .torii{display:none;}

.footer-note{margin-top:52px; text-align:center; font-size:11px; color:var(--ink-dim); letter-spacing:0.5px;}
.footer-note .heart{color:var(--gold-dim);}
